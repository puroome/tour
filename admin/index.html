<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#123f35">
  <meta name="description" content="발자국 관리자모드 학생 방문 현황">
  <title>발자국 관리자모드</title>
  <link rel="icon" href="../favicon.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Gowun+Dodum&family=Noto+Sans+KR:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main class="admin-shell">
    <section id="admin-loading" class="state-card" aria-live="polite"><span class="loader" aria-hidden="true"></span><p>관리 기록을 불러오는 중...</p></section>

    <section id="admin-login" class="state-card hidden">
      <p class="eyebrow">ADMIN MODE</p>
      <h1>관리자 로그인</h1>
      <p>승인된 관리자 계정으로 로그인하세요.</p>
      <button id="admin-login-button" class="primary-button" type="button">Google 계정으로 로그인</button>
      <a class="back-link" href="../">앱으로 돌아가기</a>
      <p id="admin-login-error" class="error-text hidden" role="alert"></p>
    </section>

    <section id="admin-error" class="state-card hidden">
      <p class="eyebrow">ACCESS DENIED</p>
      <h1>관리자 권한이 필요합니다.</h1>
      <p id="admin-error-message">권한을 확인할 수 없습니다.</p>
      <button id="admin-retry-button" class="primary-button" type="button">다시 확인</button>
      <a class="back-link" href="../">앱으로 돌아가기</a>
    </section>

    <section id="admin-dashboard" class="hidden">
      <header class="admin-header">
        <div><p class="eyebrow">ADMIN MODE</p><h1>방문 현황</h1></div>
        <div class="header-actions"><button id="admin-refresh-button" type="button" aria-label="새로고침" title="새로고침">↻</button><a href="../" aria-label="앱으로 돌아가기" title="앱으로 돌아가기">×</a></div>
      </header>

      <nav class="dashboard-tabs" aria-label="관리자 통계 구분">
        <button class="active" type="button" data-tab="students">학생별</button>
        <button type="button" data-tab="regions">지역별</button>
        <button type="button" data-tab="themes">테마별</button>
      </nav>

      <section id="students-panel" class="dashboard-panel active" aria-labelledby="students-tab-title">
        <div class="panel-heading"><div><p class="eyebrow">ALL STUDENTS</p><h2 id="students-tab-title">학생별 전체 달성률</h2></div><span id="student-rank-count" class="result-count"></span></div>
        <div id="student-podium" class="podium" aria-label="상위 3명"></div>
        <div id="student-ranking" class="ranking-list"></div>
      </section>

      <section id="regions-panel" class="dashboard-panel" aria-labelledby="regions-tab-title">
        <div class="panel-heading"><div><p class="eyebrow">BY REGION</p><h2 id="regions-tab-title">지역별 달성률</h2></div></div>
        <label class="select-label" for="admin-region-select">지역 선택</label>
        <select id="admin-region-select" class="admin-select"></select>
        <div id="region-podium" class="podium" aria-label="상위 3명"></div>
        <div id="region-ranking" class="ranking-list"></div>
      </section>

      <section id="themes-panel" class="dashboard-panel" aria-labelledby="themes-tab-title">
        <div class="panel-heading"><div><p class="eyebrow">BY THEME</p><h2 id="themes-tab-title">테마별 달성률</h2></div></div>
        <div class="filter-grid">
          <label><span>지역</span><select id="admin-theme-region-select" class="admin-select"></select></label>
          <label><span>테마</span><select id="admin-theme-select" class="admin-select"></select></label>
        </div>
        <p class="theme-note">해당 테마에서 3개 이상 방문한 학생만 표시됩니다.</p>
        <div id="theme-ranking" class="ranking-list theme-ranking"></div>
      </section>
    </section>
  </main>

  <iframe id="admin-api-frame" name="admin-api-frame" title="관리 기록 요청" hidden></iframe>
  <script src="../js/map-data.js"></script>
  <script src="../js/map-data-export.js"></script>
  <script type="module" src="./app.js"></script>
</body>
</html>
